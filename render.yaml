services:
  - type: web
    name: bloodyjack
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/storage/bloodyjack.db
    disk:
      name: bloodyjack-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
